services:
  my-honey-pot:
    build: .
    image: my-honey-pot:latest
    container_name: my-honey-pot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - HIVE_USERNAME=${HIVE_USERNAME}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-}
      - CONFIG_PARENT_AUTHOR=${CONFIG_PARENT_AUTHOR:-}
      - CONFIG_PARENT_PERMLINK=${CONFIG_PARENT_PERMLINK:-}
      - BRANDING_NAME=${BRANDING_NAME:-}
      - BRANDING_URL=${BRANDING_URL:-}
      - BRANDING_KOFI_URL=${BRANDING_KOFI_URL:-}
      - BRANDING_EDITOR_URL=${BRANDING_EDITOR_URL:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||4321)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    expose:
      - "4321"
    networks:
      - common_proxy_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.my-honey-pot.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.my-honey-pot.tls=true"
      - "traefik.http.services.my-honey-pot.loadbalancer.server.port=4321"
      - "traefik.http.routers.my-honey-pot.service=my-honey-pot"
      - "traefik.http.routers.my-honey-pot.entrypoints=websecure"

networks:
  common_proxy_network:
    external: true
